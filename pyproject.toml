[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dseek_tracker"
version = {attr = "dseek_tracker.__version__"}
description = "Tracking de consumo de APIs DeepSeek com interface gráfica, ranking por utilizador e exportação de relatórios PDF."
authors = [{name = "Nataniel"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "fpdf2>=2.6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
dseek-tracker = "dseek_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
